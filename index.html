<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roteirinho</title><style>body{font:16px system-ui;background:#f5f7f5;color:#163b33;margin:0}header{background:#174c42;color:white;padding:28px}main{max-width:900px;margin:auto;padding:20px}section,article{background:white;border:1px solid #dae5dd;border-radius:14px;padding:18px;margin:12px 0}input,select{padding:12px;border:1px solid #b7c6bc;border-radius:8px;max-width:100%}label{display:inline-grid;gap:6px;margin:8px}article a{color:#146c55}small{color:#52655c}</style><header><h1>Roteirinho</h1><p>Eventos infantis reais na Grande Tijuca e Centro do Rio</p></header><main><p id="status">Carregando base...</p><section><label>O que procura?<input id="q" placeholder="Teatro, oficina..."></label><label>Idade<input id="idade" type="number" min="0" max="17"></label><label>Data<input id="data" type="date"></label><label>Região<select id="regiao"><option value="">Todas</option><option>Grande Tijuca</option><option>Centro</option></select></label><label>Máximo por ingresso (R$)<input id="preco" type="number" min="0"></label></section><div id="lista"></div></main><script>
let dados=[];const ids=["q","idade","data","regiao","preco"], el=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){let hoje=new Date().toLocaleDateString("sv-SE",{timeZone:"America/Sao_Paulo"});let items=dados.filter(e=>e.data>=hoje).filter(e=>!el("data").value||e.data===el("data").value).filter(e=>!el("regiao").value||e.regiao===el("regiao").value).filter(e=>!el("q").value||(e.nome+" "+e.descricao+" "+e.categoria).toLowerCase().includes(el("q").value.toLowerCase())).filter(e=>!el("idade").value||(e.idade_min!=null&&e.idade_max!=null&&+el("idade").value>=e.idade_min&&+el("idade").value<=e.idade_max)).filter(e=>!el("preco").value||(e.preco_min!=null&&e.preco_min<=+el("preco").value));el("lista").innerHTML=items.length?items.map(e=>'<article><h2>'+esc(e.nome)+'</h2><p>'+esc(e.data)+' · '+esc(e.hora||"Horário não informado")+' · '+esc(e.local)+' ('+esc(e.bairro)+')</p><p>'+esc(e.descricao)+'</p><p>'+esc(e.preco_texto)+'</p><small>Faixa etária: '+(e.idade_min==null?"não informada":esc(e.idade_min)+"–"+esc(e.idade_max))+'</small><p><a target="_blank" rel="noopener" href="'+encodeURI(e.url)+'">Conferir fonte oficial</a></p></article>').join(""):"<section>Nenhum evento confirmado nesta base para os filtros escolhidos. Não significa ausência de programação na cidade.</section>"}
ids.forEach(id=>el(id).addEventListener("input",render));fetch("./eventos.json").then(r=>{if(!r.ok)throw Error("Falha HTTP");return r.json()}).then(d=>{dados=d.eventos||[];el("status").textContent="Última coleta: "+(d.atualizado_em||"não executada")+" · "+dados.length+" registros. Confirme ingressos e horários nas fontes.";render()}).catch(()=>el("status").textContent="Não foi possível carregar a base. Abra pelo endereço publicado do site.");</script></html>
