name: Atualizar eventos
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar eventos
        run: python collector.py
      - name: Validar base
        run: python -m json.tool eventos.json > /dev/null
      - name: Persistir atualizacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eventos.json
          git diff --cached --quiet || (git commit -m 'Atualizar base de eventos' && git push)
